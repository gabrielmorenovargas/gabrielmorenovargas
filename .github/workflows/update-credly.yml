name: Update Credly Badges

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Credly badges
        uses: pemtajo/badge-readme@main
        with:
          CREDLY_USER: "gabriel-andres-moreno-vargas"
